<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PawAlert | Sign up</title><link rel="stylesheet" href="style.css"></head><body><div class="page-texture"></div><div id="cat-companion" class="cat-companion"><img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=420&q=85" alt="A real cat"><span class="cat-shadow"></span></div><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>PawAlert</span></a><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="report.html">Report</a><a href="login.html">Log in</a><a class="nav-cta active" href="signup.html">Sign up</a></nav></header><main class="page-main auth-main"><section class="auth-card"><p class="eyebrow"><span></span> Join PawAlert</p><h1>Make your area safer for animals.</h1><p>Create a citizen account to submit and follow up on reports.</p><form data-api="signup"><label>Your name<input name="name" required autocomplete="name"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><div class="otp-area" hidden><label>Verification code<input name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></label><p>We sent a verification code to your email.</p></div><button class="button button-primary" type="submit">Send verification code <span>-></span></button><p class="form-status" aria-live="polite"></p></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></section></main><footer><a class="brand" href="index.html"><span class="brand-mark">P</span><span>PawAlert</span></a><p>Care begins when someone notices.</p></footer><script src="script.js"></script></body></html>
